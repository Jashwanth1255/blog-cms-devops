name: CI/CD - Blog CMS API

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE_NAME: blog-cms-api

jobs:
  build:
    name: Lint and smoke-test the API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        working-directory: app
        run: flake8 app.py --max-line-length=120

      - name: Smoke test (start app, hit /health)
        working-directory: app
        run: |
          python app.py &
          sleep 3
          curl --fail http://localhost:5000/health

  docker:
    name: Build and push Docker image
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip notice when Docker Hub secrets are missing
        if: env.DOCKERHUB_USERNAME == ''
        run: echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets not set - building only, not pushing."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push if logged in)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: ${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME || 'local' }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_USERNAME || 'local' }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-test:
    name: Deploy to a test Kubernetes cluster (kind)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Build image and load it into kind
        run: |
          docker build -t blog-cms-api:latest ./app
          kind load docker-image blog-cms-api:latest --name chart-testing

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-config.yaml -f k8s/02-postgres.yaml -f k8s/03-api.yaml
          kubectl -n blog rollout status deployment/blog-db --timeout=180s
          kubectl -n blog rollout status deployment/blog-api --timeout=180s

      - name: Check the deployed API
        run: |
          kubectl -n blog port-forward svc/blog-api 5000:5000 &
          sleep 5
          curl --fail http://localhost:5000/health
          curl --fail -X POST http://localhost:5000/api/posts \
            -H "Content-Type: application/json" \
            -d '{"title":"CI post","content":"Created by GitHub Actions"}'
          kubectl -n blog get pods
