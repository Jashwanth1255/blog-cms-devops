apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-api
  namespace: blog
  labels:
    app: blog-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: blog-api
  template:
    metadata:
      labels:
        app: blog-api
    spec:
      initContainers:
        # Wait for PostgreSQL before the API starts
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z blog-db 5432; do echo waiting for db; sleep 2; done"]
      containers:
        - name: api
          # Replace with <your-dockerhub-username>/blog-cms-api:latest to pull from Docker Hub
          image: blog-cms-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: blog-db-secret, key: DATABASE_URL }
          envFrom:
            - configMapRef:
                name: blog-config
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: blog-api
  namespace: blog
  labels:
    app: blog-api
spec:
  type: NodePort
  selector:
    app: blog-api
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
---
# Autoscale the API between 2 and 5 pods when average CPU passes 60%
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: blog-api-hpa
  namespace: blog
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: blog-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
